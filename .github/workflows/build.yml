name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check translations
        run: swift scripts/check-strings.swift
      - name: Build the app
        run: scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Pinza.app build/Pinza.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pinza
          path: build/Pinza.zip
